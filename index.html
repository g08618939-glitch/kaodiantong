<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#173b63">
<meta name="description" content="初二上册七科学习视频整理与学习进度管理">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>初二上册·考点通</title>
<style>
:root{--navy:#173b63;--blue:#2d5e8d;--bg:#f4f7fb;--card:#fff;--ink:#172334;--muted:#697789;--line:#e5eaf0;--green:#16845b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
header{background:linear-gradient(135deg,#173b63,#285b86);color:#fff;padding:22px 18px 20px;border-radius:0 0 22px 22px}
.top{display:flex;justify-content:space-between;align-items:center;font-size:14px;opacity:.95}.pill{border:1px solid #ffffff55;border-radius:20px;padding:5px 10px;font-size:12px}
h1{font-size:25px;margin:20px 0 6px;letter-spacing:.3px}header p{margin:0;color:#dce8f4;font-size:13px}
.wrap{max-width:780px;margin:auto;padding:16px 14px 40px}
.progress{margin-top:-1px;background:white;border-radius:15px;padding:14px 16px;box-shadow:0 5px 18px #1c35520d}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}.muted{color:var(--muted);font-size:12px}.big{font-weight:700;font-size:19px;margin-top:5px}.bar{height:7px;background:#edf1f5;border-radius:9px;margin-top:12px;overflow:hidden}.bar span{display:block;height:100%;background:var(--green);width:0;transition:width .2s}
h2{font-size:16px;margin:22px 2px 12px}
.subjects{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.subject{border:1px solid var(--line);background:#fff;border-radius:13px;padding:12px 5px;text-align:center;color:var(--ink);font:inherit;cursor:pointer}
.subject .emoji{font-size:22px;display:block;margin-bottom:6px}.subject small{font-size:11px;color:var(--muted)}
.subject.active{border-color:#315f8b;background:#edf4fb;box-shadow:inset 0 0 0 1px #315f8b}
.controls{display:flex;gap:8px;margin:15px 0 12px}.search{flex:1;min-width:0;border:1px solid var(--line);border-radius:11px;padding:11px 12px;font-size:14px;background:white}
select{border:1px solid var(--line);border-radius:11px;padding:0 9px;background:#fff;color:#344256}
.cards{display:grid;gap:10px}.card{background:white;border:1px solid var(--line);border-radius:14px;padding:14px}
.cardtop{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.tag{font-size:11px;border-radius:20px;background:#edf3f8;color:#315b80;padding:5px 8px;white-space:nowrap}
.card h3{font-size:15px;line-height:1.45;margin:0 0 6px}.card p{font-size:12px;color:var(--muted);line-height:1.6;margin:0 0 12px}
.actions{display:flex;align-items:center;justify-content:space-between;gap:8px}.watch{background:var(--navy);color:#fff;text-decoration:none;border-radius:9px;padding:9px 13px;font-size:13px}
.done{display:flex;align-items:center;gap:6px;color:#526174;font-size:12px}.done input{width:17px;height:17px;accent-color:var(--green)}
.notice{font-size:12px;line-height:1.65;color:#6d5b35;background:#fff8e9;border:1px solid #f2e5c8;border-radius:12px;padding:12px;margin-top:16px}
footer{text-align:center;color:#8b96a5;font-size:11px;margin:24px 0 6px}
.empty{padding:26px;text-align:center;color:var(--muted);background:white;border-radius:14px}
@media(max-width:390px){.subjects{grid-template-columns:repeat(4,1fr)}.subject{padding:10px 2px}.subject .emoji{font-size:20px}}
</style>
</head>
<body>
<header><div class="top"><strong>📘 初二上册学习中心</strong><span class="pill">七科复习</span></div><h1>初二上册 · 考点通</h1><p>知识串讲 · 重点总结 · 考前复习</p></header>
<main class="wrap">
<section class="progress">
 <div class="row"><div><div class="muted">我的学习进度</div><div class="big"><span id="doneCount">0</span> / <span id="totalCount">0</span> 个视频已完成</div></div><div style="font-size:25px">🎯</div></div>
 <div class="bar"><span id="progressBar"></span></div>
</section>
<h2>选择学科</h2><section class="subjects" id="subjects"></section>
<div class="controls"><input id="search" class="search" placeholder="搜索课程、章节或关键词…"><select id="sort"><option value="recommended">推荐顺序</option><option value="name">课程名称</option></select></div>
<div class="row" style="margin:5px 2px 10px"><h2 id="listTitle" style="margin:0">全部视频</h2><span class="muted" id="resultCount"></span></div>
<section class="cards" id="cards"></section>
<div class="notice"><strong>教材版本提醒：</strong>视频资源已按2025秋人教版优先重新整理。快速串讲、单词语法、章节精讲分开标注；尚未核实新版目录的资源会明确提示。数学和部分生物资源暂时以检索入口或待核资源呈现，不把未确认内容当作新教材标准答案。视频由 B 站提供，点击后在网页或 B 站播放；本 App 不下载视频。</div>
<footer>初二上册·考点通 · 学习资料整理工具</footer>
</main>
<script>
const resources = [
{subject:"数学",title:"人教版八上数学·全册知识点串讲检索",type:"快速串讲待核",url:"https://search.bilibili.com/all?keyword=2025秋%20人教版八年级上册数学%20全册知识点串讲",note:"优先选择标题含‘全册知识点、期末总复习、考点归纳’的视频；目前未确认一条目录完整且明确匹配新版的浓缩视频，先不拿旧版冒充。"},
{subject:"数学",title:"人教版八上数学·单元考点与易错题检索",type:"考点强化",url:"https://search.bilibili.com/all?keyword=人教版八年级上册数学%20期末知识点%20易错题",note:"按学校当前章节选择；重点检查三角形、全等三角形、轴对称等章节是否与本册目录一致。"},
{subject:"英语",title:"2025秋人教版八上全册单词预习（8单元）",type:"快速记忆·约1小时42分",url:"https://www.bilibili.com/video/BV11KaSz5Eth/",note:"8个单元，每单元约10—15分钟；适合跟读、拼读和拼写。"},
{subject:"英语",title:"2025新版八上英语语法合集",type:"语法串讲",url:"https://www.bilibili.com/video/BV1UEvAz8EQK/",note:"目前展示不定代词、can/could等单元语法短讲；适合与单词视频配合。"},
{subject:"英语",title:"2025秋八上英语核心知识点（人教版）",type:"单元考点",url:"https://www.bilibili.com/video/BV1xj1YBSE7T/",note:"8个单元，每集约14—27分钟；比完整课文精讲更适合复习。"},
{subject:"物理",title:"2025新版人教版八上物理·全册同步课程",type:"章节补漏·非浓缩",url:"https://www.bilibili.com/video/BV19Gegz9ESA/",note:"25个章节，涵盖机械运动、声、物态变化、光、透镜、质量与密度；单集约10—20分钟，适合按薄弱点选看。"},
{subject:"物理",title:"八上物理必背考点与期中期末冲刺检索",type:"快速考点检索",url:"https://search.bilibili.com/all?keyword=2025秋%20人教版八年级上册物理%20必背知识点%20考点总结",note:"优先选择明确标注2025新版人教版的考点总结；注意旧版章节顺序可能不同。"},
{subject:"生物",title:"八上生物重点带背（约44分钟）",type:"快速带背·版本待核",url:"https://www.bilibili.com/video/BV1SLS7Y8Eoa/",note:"适合快速记忆，但尚未充分核实与2025秋人教版新教材目录逐章一致；先对照课本目录使用。"},
{subject:"生物",title:"2025适用人教版八上生物课程合集",type:"章节补漏·非浓缩",url:"https://www.bilibili.com/video/BV1xt3ezHEsa/",note:"38集动物、运动与行为等章节讲解；适合薄弱章节补课，不建议当作快速串讲。"},
{subject:"地理",title:"八年级上册地理核心知识点动画梳理",type:"快速串讲·约2小时多",url:"https://www.bilibili.com/video/BV1QzSgBgEEH/",note:"合集含八上和八下；八上部分覆盖疆域、人口、民族、地形、气候、河流、自然灾害、资源、交通等。"},
{subject:"地理",title:"人教版八年级地理微课知识点（短视频）",type:"碎片化速记",url:"https://www.bilibili.com/video/BV1xGHHzgEYM/",note:"每段多为2—8分钟，按知识点拆分；内容含八上、八下，选择八上对应条目。"},
{subject:"历史",title:"2025新版八上历史名师精讲（19集）",type:"系统串讲·约8小时50分",url:"https://www.bilibili.com/video/BV1TypxzZEvT/",note:"覆盖鸦片战争至抗战相关内容；属于分课精讲，适合不理解的章节，不是短时浓缩视频。"},
{subject:"历史",title:"2025秋八上历史系统课程（20集）",type:"章节复习·约7小时多",url:"https://www.bilibili.com/video/BV1LWnozdERM/",note:"含九一八、西安事变、七七事变等章节；按学校教材目录核对后选看。"},
{subject:"道德与法治",title:"2025年秋八上道德与法治全册知识点",type:"全册知识点·优先",url:"https://www.bilibili.com/video/BV1Qc8XztEJC/",note:"作者说明依据2025年秋新版纸质课本整理；建议作为全册知识点主资源。"},
{subject:"道德与法治",title:"八上道法全册知识点/考点带背检索",type:"快速背诵补充",url:"https://search.bilibili.com/all?keyword=2025秋%20人教版八年级上册道德与法治%20知识点%20考点带背",note:"如主资源是图文讲解，可再选择短时考点带背视频。"}
];
const subjects=[["全部","📚","全部课程"],["数学","📐","知识点·题型"],["英语","🔤","单词·语法"],["物理","⚛️","公式·实验"],["生物","🧬","概念·识图"],["地理","🌍","地图·考点"],["历史","📜","时间线"],["道德与法治","⚖️","知识·材料题"]];
let active="全部";
const done=JSON.parse(localStorage.getItem("studyDone")||"{}");
const subjectBox=document.getElementById("subjects");
subjects.forEach(([name,emoji,sub])=>{const b=document.createElement("button");b.className="subject"+(name==="全部"?" active":"");b.innerHTML=`<span class="emoji">${emoji}</span><strong>${name}</strong><br><small>${sub}</small>`;b.onclick=()=>{active=name;document.querySelectorAll(".subject").forEach(x=>x.classList.remove("active"));b.classList.add("active");render()};subjectBox.appendChild(b)});
function updateProgress(){const total=resources.length, count=Object.values(done).filter(Boolean).length;document.getElementById("doneCount").textContent=count;document.getElementById("totalCount").textContent=total;document.getElementById("progressBar").style.width=(total?count/total*100:0)+"%"}
function render(){const q=document.getElementById("search").value.trim().toLowerCase();let list=resources.filter(x=>(active==="全部"||x.subject===active)&&[x.title,x.note,x.type,x.subject].join(" ").toLowerCase().includes(q));if(document.getElementById("sort").value==="name")list.sort((a,b)=>a.title.localeCompare(b.title,"zh-CN"));document.getElementById("listTitle").textContent=active==="全部"?"全部视频":active+"课程";document.getElementById("resultCount").textContent=list.length+" 项";const box=document.getElementById("cards");box.innerHTML="";if(!list.length){box.innerHTML='<div class="empty">没有找到匹配课程</div>';return}list.forEach((x)=>{const id=x.subject+"|"+x.title;const card=document.createElement("article");card.className="card";card.innerHTML=`<div class="cardtop"><div><h3>${x.title}</h3><p>${x.note}</p></div><span class="tag">${x.type}</span></div><div class="actions"><a class="watch" href="${x.url}" target="_blank" rel="noopener">▶ 观看视频</a><label class="done"><input type="checkbox" ${done[id]?"checked":""}>已学完</label></div>`;card.querySelector("input").addEventListener("change",e=>{done[id]=e.target.checked;localStorage.setItem("studyDone",JSON.stringify(done));updateProgress()});box.appendChild(card)})}
document.getElementById("search").addEventListener("input",render);document.getElementById("sort").addEventListener("change",render);updateProgress();render();
if("serviceWorker" in navigator && location.protocol.startsWith("http")){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}))}
</script>
</body></html>
